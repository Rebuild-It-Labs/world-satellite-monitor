<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="World Satellite Monitor — Global AI Earth observation & multi-class land-cover intelligence tracking planetary changes."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var theme = params.get('theme') || localStorage.getItem('wsm-theme') || 'mission-control';
          var valid = ['mission-control', 'harry-potter', 'dr-doom', 'spider-man', 'beauty-beast', 'money-heist'];
          if (valid.indexOf(theme) !== -1) {
            document.documentElement.setAttribute('data-theme', theme);
          }
        } catch (e) {}
      })();
    </script>
    <title>World Satellite Monitor — Global AI Earth Observation</title>
  </head>
  <body class="bg-black">
    <div id="root"></div>
    <noscript>This dashboard requires JavaScript and WebGL.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
