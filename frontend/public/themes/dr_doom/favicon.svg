<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Background Badge Outer Ring -->
  <circle cx="50" cy="50" r="47" fill="#05130b" stroke="#00ff77" stroke-width="2.5" opacity="0.95"/>
  <circle cx="50" cy="50" r="42" stroke="#c5a059" stroke-width="1" stroke-dasharray="3 2" opacity="0.6"/>

  <!-- Latverian Hood Cowl -->
  <path d="M22 68 C 18 42 28 14 50 12 C 72 14 82 42 78 68 C 72 64 68 58 64 54 C 60 38 64 26 50 26 C 36 26 40 38 36 54 C 32 58 28 64 22 68 Z" fill="#0a2e18" stroke="#00ff77" stroke-width="1.5"/>
  <!-- Hood Inner Shadow -->
  <path d="M28 58 C 28 32 36 24 50 24 C 64 24 72 32 72 58 C 66 52 64 42 60 38 C 55 34 45 34 40 38 C 36 42 34 52 28 58 Z" fill="#041008"/>

  <!-- Titanium Mask Faceplate -->
  <path d="M33 42 L67 42 L65 66 L59 78 L50 82 L41 78 L35 66 Z" fill="#3f3f46" stroke="#71717a" stroke-width="1.5"/>
  <!-- Mask Forehead Plate and Brow Ridge -->
  <polygon points="34,42 66,42 62,49 38,49" fill="#27272a" stroke="#52525b" stroke-width="1"/>
  <line x1="50" y1="42" x2="50" y2="50" stroke="#c5a059" stroke-width="1.5"/>

  <!-- Menacing Angled Glowing Eyes (Emerald Arcane Power) -->
  <polygon points="37,52 46,55 45,58 38,56" fill="#00ff77"/>
  <polygon points="63,52 54,55 55,58 62,56" fill="#00ff77"/>

  <!-- Nose Ridge and Cheek Rivets -->
  <polygon points="48,51 52,51 51,62 49,62" fill="#18181b"/>
  <circle cx="37" cy="46" r="1.2" fill="#c5a059"/>
  <circle cx="63" cy="46" r="1.2" fill="#c5a059"/>
  <circle cx="38" cy="64" r="1.2" fill="#c5a059"/>
  <circle cx="62" cy="64" r="1.2" fill="#c5a059"/>

  <!-- Titanium Mouth Vents / Grille -->
  <line x1="44" y1="68" x2="56" y2="68" stroke="#18181b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="45" y1="72" x2="55" y2="72" stroke="#18181b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="47" y1="76" x2="53" y2="76" stroke="#18181b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Monarch Gold Clasps on Mantle -->
  <circle cx="30" cy="74" r="3.5" fill="#c5a059" stroke="#e5c178" stroke-width="1"/>
  <circle cx="70" cy="74" r="3.5" fill="#c5a059" stroke="#e5c178" stroke-width="1"/>
  <path d="M33 74 Q 50 80 67 74" stroke="#c5a059" stroke-width="1" fill="none" stroke-dasharray="2 2"/>
